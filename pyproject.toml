[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-emergent-misalignment"
version = "0.1.0"
description = "Python experiments and preserved results for VLM emergent misalignment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
analysis = ["numpy>=2", "pandas>=2", "scipy>=1.11", "matplotlib>=3.8", "torch>=2.6,<3"]
models = ["torch>=2.4,<3", "transformers>=4.56,<5", "peft>=0.17", "accelerate>=1", "datasets>=3", "huggingface-hub>=0.34,<1", "pillow>=10", "numpy>=1.26", "pandas>=2", "scipy>=1.11", "matplotlib>=3.8", "requests>=2.32", "tqdm>=4.65", "safetensors>=0.4", "sentencepiece>=0.2"]
evaluation = ["openai>=2,<3", "datasets>=3", "pillow>=10", "tqdm>=4.65", "matplotlib>=3.8", "numpy>=1.26"]
synthetic = ["openai>=2,<3", "sentence-transformers>=3", "scikit-learn>=1.4", "huggingface-hub>=0.34,<1", "torch>=2.4,<3", "numpy>=1.26", "tqdm>=4.65"]
quantization = ["bitsandbytes>=0.43", "accelerate>=1"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2"]

[project.urls]
Repository = "https://github.com/rlogger/vlm-emergent-misalignment"

[project.scripts]
vlm-em-artifacts = "vlm_em.artifacts:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
